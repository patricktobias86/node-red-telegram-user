<script type="text/html" data-template-name="receiver">
    <div class="form-row">
      <label for="node-input-name">
        <i class="fa fa-tag"></i> Name
      </label>
      <input
        type="text"
        id="node-input-name"
        placeholder="Name"
        style="width: 60%"
      />
    </div>
    <div class="form-row">
      <label for="node-input-config">
        <i class="fa fa-tag"></i> Config
      </label>
      <input
        type="text"
        id="node-input-config"
        placeholder="Config"
        style="width: 60%"
      />
    </div>
    <div class="form-row">
      <label for="node-input-debug">
        <i class="fa fa-bug"></i> Debug
      </label>
      <input type="checkbox" id="node-input-debug">
    </div>
    <div class="form-row">
      <label for="node-input-emitEdits">
        <i class="fa fa-pencil"></i> Emit edits
      </label>
      <input type="checkbox" id="node-input-emitEdits">
      <p class="form-tips">When disabled, edited message updates (e.g. like/view counters changing on channel posts) are ignored.</p>
    </div>
    <div class="form-row">
      <label for="node-input-ignore">
        <i class="fa fa-user-times"></i> Ignore list
      </label>
      <textarea
        type="text"
        id="node-input-ignore"
        placeholder="Enter user IDs, one per line"
        style="width: 60%"
      ></textarea>
    </div>
    <div class="form-row">
      <label for="node-input-ignoreMessageTypes">
        <i class="fa fa-ban"></i> Ignore message types
      </label>
      <textarea
        id="node-input-ignoreMessageTypes"
        placeholder="e.g. video, document, sticker"
        style="width: 60%"
      ></textarea>
      <p class="form-tips">Separate types with commas or new lines.</p>
    </div>
    <div class="form-row">
      <label for="node-input-maxFileSizeMb">
        <i class="fa fa-download"></i> Max media size (MB)
      </label>
      <input
        type="number"
        id="node-input-maxFileSizeMb"
        placeholder="Leave blank to disable"
        min="0"
        step="0.1"
        style="width: 60%"
      />
    </div>
    <div class="form-row">
      <label for="node-input-includeChats">
        <i class="fa fa-plus-circle"></i> Include chats
      </label>
      <textarea
        id="node-input-includeChats"
        placeholder="Enter chat IDs, one per line"
        style="width: 60%"
      ></textarea>
      <p class="form-tips">Only listen to messages from these chats. Leave blank to include all.</p>
    </div>
    <div class="form-row">
      <label for="node-input-excludeChats">
        <i class="fa fa-minus-circle"></i> Exclude chats
      </label>
      <textarea
        id="node-input-excludeChats"
        placeholder="Enter chat IDs, one per line"
        style="width: 60%"
      ></textarea>
      <p class="form-tips">Ignore messages from these chats. Leave blank to exclude none.</p>
    </div>
    <div class="form-row">
      <label for="node-input-includeSenders">
        <i class="fa fa-user-plus"></i> Include senders
      </label>
      <textarea
        id="node-input-includeSenders"
        placeholder="Enter sender IDs, one per line"
        style="width: 60%"
      ></textarea>
      <p class="form-tips">Only listen to messages from these senders. Leave blank to include all.</p>
    </div>
    <div class="form-row">
      <label for="node-input-excludeSenders">
        <i class="fa fa-user-times"></i> Exclude senders
      </label>
      <textarea
        id="node-input-excludeSenders"
        placeholder="Enter sender IDs, one per line"
        style="width: 60%"
      ></textarea>
      <p class="form-tips">Ignore messages from these senders. Leave blank to exclude none.</p>
    </div>
  </script>

<script type="text/html" data-help-name="receiver">
    <p>The <b>receiver</b> node listens for incoming Telegram messages and forwards them as output messages in Node-RED. It supports filtering messages based on sender IDs to ignore specific users.</p>
    <p>Turn on <b>Debug</b> to log received updates and the emitted messages.</p>

    <h3>Inputs</h3>
    <p>This node does not take any direct inputs. It listens to all incoming messages from the configured Telegram client.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>output 1
            <span class="property-type">message</span>
        </dt>
        <dd>The parsed incoming Telegram message.</dd>
        <dt>output 2
            <span class="property-type">message</span>
        </dt>
        <dd>Debug messages emitted when <b>Debug</b> is enabled (suitable for wiring to a Node-RED debug node).</dd>
        <dt>payload.update
            <span class="property-type">object</span>
        </dt>
        <dd>The raw Telegram update object containing details about the incoming message, sender, chat, and metadata.</dd>
        <dt>payload.chatId
            <span class="property-type">number</span>
        </dt>
        <dd>The normalized conversation identifier (user ID for private chats, chat ID for legacy groups, channel ID for supergroups/channels).</dd>
    </dl>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Telegram Configuration
            <span class="property-type">node</span>
        </dt>
        <dd>A configured Telegram client node to receive messages. Ensure the client is authenticated and has necessary permissions.</dd>

        <dt>Ignore List
            <span class="property-type">string</span>
        </dt>
        <dd>A newline-separated list of user IDs to ignore. Messages from these users will not trigger the output.</dd>

        <dt>Ignore message types
            <span class="property-type">string</span>
        </dt>
        <dd>List of message or media types to skip (for example <code>video</code>, <code>document</code>, or <code>sticker</code>). Separate multiple entries with commas or new lines.</dd>

        <dt>Emit edits
            <span class="property-type">boolean</span>
        </dt>
        <dd>When disabled, the receiver ignores edited message updates (such as <code>UpdateEditChannelMessage</code>) to avoid duplicate outputs for the same post.</dd>

        <dt>Max media size (MB)
            <span class="property-type">number</span>
        </dt>
        <dd>Skip updates that include media exceeding this size. Leave blank to process all media.</dd>

        <dt>Include chats
            <span class="property-type">string</span>
        </dt>
        <dd>Newline-separated list of chat IDs to listen to. Leave blank to listen to all chats.</dd>

        <dt>Exclude chats
            <span class="property-type">string</span>
        </dt>
        <dd>Newline-separated list of chat IDs to ignore. Leave blank to exclude none.</dd>

        <dt>Include senders
            <span class="property-type">string</span>
        </dt>
        <dd>Newline-separated list of sender IDs to listen to. Leave blank to listen to all senders.</dd>

        <dt>Exclude senders
            <span class="property-type">string</span>
        </dt>
        <dd>Newline-separated list of sender IDs to ignore. Leave blank to exclude none.</dd>
    </dl>

    <h3>Details</h3>
    <p>The <b>receiver</b> node uses the Telegram client to listen for all new messages in real-time. It emits a message to the next connected Node-RED node whenever a new Telegram message is received, provided it passes the configured filters.</p>

    <h3>Example</h3>
    <pre>
    {
        "payload": {
            "update": {
                "message": {
                    "message": "Hello, bot!",
                    "sender": {
                        "id": 123456789,
                        "username": "exampleuser"
                    },
                    "chat": {
                        "id": 987654321,
                        "type": "private"
                    }
                }
            }
        }
    }
    </pre>
    <p>In this example, the node outputs the raw Telegram update object when a user sends the message "Hello, bot!" to the Telegram bot.</p>

    <h3>Error Handling</h3>
    <p>If the Telegram client encounters an authentication issue or configuration error, the node logs an error message and stops listening for messages.</p>

    <h3>Advanced Usage</h3>
    <p>By configuring the <b>Ignore List</b>, you can filter out messages from specific users. For example:</p>
    <pre>
    123456789
    987654321
    </pre>
    <p>In this case, messages from user IDs <code>123456789</code> and <code>987654321</code> will be ignored.</p>

    <h3>Notes</h3>
    <ul>
        <li>Ensure the Telegram bot has sufficient permissions to receive messages in the configured chat or channel.</li>
        <li>The <b>Ignore List</b> only filters messages where the sender can be identified as a user.</li>
        <li><b>Include/Exclude chats</b> match against <code>payload.chatId</code>.</li>
        <li><b>Include/Exclude senders</b> match against <code>payload.senderId</code> (user/chat/channel IDs depending on the update).</li>
        <li>Use <b>Ignore message types</b> to drop updates that contain media you don't want to process, such as large videos or documents.</li>
        <li>For advanced filtering based on message content, consider chaining this node with additional processing nodes in Node-RED.</li>
    </ul>
</script>
